# Blueprint do Render: descreve o serviço web do NextLearn.
# Valores com "sync: false" são preenchidos à mão no painel do Render (nunca no Git).
services:
  - type: web
    name: nextlearn
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # Timeout de 120 s: gerar uma versão com a IA pode passar dos 30 s padrão do gunicorn.
    startCommand: gunicorn config.wsgi:application --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_PAPEL
        value: professor
