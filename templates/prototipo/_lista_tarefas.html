<h3>Para fazer</h3>
<ul class="tarefas">
  {% for t in pendentes %}
    <li><a href="{% url 'aulas:ver' t.aula.pk %}"><span><strong>{{ t.assunto }}</strong><span class="suave"> · {{ t.materia }}</span></span><span class="selo selo-nova">Nova</span></a></li>
  {% empty %}<li class="suave">Nada pendente.</li>{% endfor %}
</ul>
<h3>Feitas</h3>
<ul class="tarefas">
  {% for t in feitas %}
    <li><a href="{% url 'aulas:ver' t.aula.pk %}"><span><strong>{{ t.assunto }}</strong><span class="suave"> · {{ t.materia }} · {{ t.quando|date:"d/m" }}</span></span><span class="selo">{{ t.acertos }} de {{ t.total }} certas</span></a></li>
  {% endfor %}
</ul>
