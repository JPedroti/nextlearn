<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aluno · NextLearn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --fundo:#F7F8FA;--superficie:#FFFFFF;--texto:#1F2933;--texto-suave:#52606D;--destaque:#2B59C3;--destaque-suave:#E6EDFB;--borda:#E1E5EA; }
    body { background:var(--fundo); color:var(--texto); font-family:"Atkinson Hyperlegible",system-ui,sans-serif; padding:2rem 1rem; }
    button,a { min-height:44px; min-width:44px; } :focus-visible { outline:3px solid var(--destaque); outline-offset:2px; }
    .container { max-width:40rem; margin:0 auto; }
    .aula-link { display:flex; align-items:center; gap:1rem; background:var(--superficie); border:1px solid var(--borda); border-radius:.75rem; padding:1.25rem; margin-bottom:.75rem; text-decoration:none; color:var(--texto); transition:all .15s; }
    .aula-link:hover { border-color:var(--destaque); background:var(--destaque-suave); }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:.5rem;color:var(--destaque);">Minhas aulas</h1>
    <p style="color:var(--texto-suave);margin-bottom:1.5rem;">Aulas publicadas pela sua turma, no formato em que você aprende melhor.</p>
    {% if aulas %}
      {% for aula in aulas %}
        <a href="?aula={{ forloop.counter }}" class="aula-link">
          <span style="font-size:1.5rem;">📚</span>
          <span>
            <strong>{{ aula.titulo }}</strong>
            <span style="display:block;font-size:.875rem;color:var(--texto-suave);">{{ aula.turma|default:"6º A" }}</span>
          </span>
        </a>
      {% endfor %}
    {% else %}
      <p style="color:var(--texto-suave);">Nenhuma aula disponível ainda.</p>
    {% endif %}
  </div>
</body>
</html>
