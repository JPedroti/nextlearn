<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professor · NextLearn</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>:root{--fundo:#F7F8FA;--superficie:#FFF;--texto:#1F2933;--texto-suave:#52606D;--destaque:#2B59C3;--destaque-suave:#E6EDFB;--borda:#E1E5EA}body{background:var(--fundo);color:var(--texto);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;padding:2rem 1rem}button,a{min-height:44px;min-width:44px}:focus-visible{outline:3px solid var(--destaque);outline-offset:2px}.container{max-width:40rem;margin:0 auto}.btn{display:inline-flex;align-items:center;justify-content:center;padding:.75rem 1.5rem;background:var(--destaque);color:#fff;border:none;border-radius:.5rem;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none}.btn:hover{opacity:.9}.btn:active{transform:scale(.97)}</style></head>
<body><div class="container"><h1 style="font-size:1.5rem;font-weight:700;margin-bottom:.5rem;color:var(--destaque)">Professor</h1><p style="color:var(--texto-suave);margin-bottom:1.5rem">Gerencie suas turmas, crie aulas e acompanhe seus alunos.</p>
<div style="display:flex;flex-direction:column;gap:.75rem"><a href="{% url 'prototipo:inicio' %}" class="btn">Modo Jogo</a><a href="{% url 'aulas:nova' turma_pk=1 %}" class="btn" style="background:var(--superficie);color:var(--texto);border:1px solid var(--borda)">Nova aula</a></div></div></body></html>
