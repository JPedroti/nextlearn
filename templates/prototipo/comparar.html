{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparar perfis · Dev</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111827; color: #F9FAFB; }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; padding: 12px 16px; }
    label { display: grid; gap: 4px; font-size: .85rem; }
    select, button { min-height: 40px; border-radius: 8px; font: inherit; padding: 0 10px; }
    .lados { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px 8px; height: calc(100vh - 80px); }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 10px; background: #FFF; }
    .aviso { font-size: .8rem; color: #9CA3AF; }
  </style>
</head>
<body>
  <form method="get">
    <label>Perfil A<select name="a">{% for p in perfis %}<option value="{{ p.id }}" {% if p.id == a %}selected{% endif %}>{{ p.nome }}</option>{% endfor %}</select></label>
    <label>Perfil B<select name="b">{% for p in perfis %}<option value="{{ p.id }}" {% if p.id == b %}selected{% endif %}>{{ p.nome }}</option>{% endfor %}</select></label>
    <label>Ambiente<select name="ambiente"><option value="">Automático</option>{% for id, nome in ambientes %}<option value="{{ id }}" {% if id == amb %}selected{% endif %}>{{ nome }}</option>{% endfor %}</select></label>
    <label>Página<select name="pagina"><option value="inicio" {% if pagina == 'inicio' %}selected{% endif %}>Trilha</option><option value="progresso" {% if pagina == 'progresso' %}selected{% endif %}>Progresso</option></select></label>
    <button type="submit">Comparar</button>
    <span class="aviso">Ferramenta do desenvolvedor (só no computador de desenvolvimento). Entre como aluno antes.</span>
  </form>
  <div class="lados">
    <iframe title="Perfil A" src="{% if pagina == 'progresso' %}{% url 'prototipo:progresso' %}{% else %}{% url 'prototipo:painel_aluno' %}{% endif %}?perfil_dev={{ a }}&ambiente={{ amb }}"></iframe>
    <iframe title="Perfil B" src="{% if pagina == 'progresso' %}{% url 'prototipo:progresso' %}{% else %}{% url 'prototipo:painel_aluno' %}{% endif %}?perfil_dev={{ b }}&ambiente={{ amb }}"></iframe>
  </div>
</body>
</html>
