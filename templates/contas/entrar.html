{% extends "base.html" %}

{% block titulo %}Entrar · NextLearn{% endblock %}

{% block conteudo %}
<div class="max-w-sm mx-auto bg-white rounded-lg shadow p-6">
  <h1 class="text-2xl font-semibold mb-1">Entrar</h1>
  <p class="text-sm text-slate-600 mb-6">A mesma aula, no jeito de cada aluno aprender.</p>

  {% if form.non_field_errors %}
    <div class="mb-4 rounded bg-red-50 border border-red-200 px-3 py-2 text-sm text-red-700">
      {% for erro in form.non_field_errors %}{{ erro }}{% endfor %}
    </div>
  {% endif %}

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium mb-1">Usuário</label>
      <input type="text" name="username" id="{{ form.username.id_for_label }}" value="{{ form.username.value|default:'' }}"
             autocomplete="username" required autofocus class="w-full rounded border border-slate-300 px-3 py-2">
    </div>
    <div>
      <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium mb-1">Senha</label>
      <input type="password" name="password" id="{{ form.password.id_for_label }}"
             autocomplete="current-password" required class="w-full rounded border border-slate-300 px-3 py-2">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="w-full rounded bg-indigo-700 text-white py-2 font-medium hover:bg-indigo-800">Entrar</button>
  </form>
</div>
{% endblock %}
