{# Um campo de formulário: rótulo, campo, ajuda e erros. Uso: {% include "_campo.html" with campo=form.nome %} #}
<div class="mb-4">
  <label for="{{ campo.id_for_label }}" class="block text-sm font-medium mb-1">{{ campo.label }}</label>
  {{ campo }}
  {% if campo.help_text %}<span class="helptext">{{ campo.help_text|safe }}</span>{% endif %}
  {{ campo.errors }}
</div>
