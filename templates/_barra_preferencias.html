{# Barra de apoios de leitura — visível apenas para alunos. #}
<div class="border-b" style="background: var(--color-primary-light); border-color: #c7d2fe;">
  <div class="max-w-5xl mx-auto px-4 py-2 flex flex-wrap items-center gap-1.5">
    <span class="text-xs font-medium mr-2" style="color: var(--color-primary);">Apoios de leitura</span>
    {% for item in barra_preferencias %}
      <form method="post" action="{% url 'perfis:alternar_preferencia' %}" data-preferencia class="contents">
        {% csrf_token %}
        <input type="hidden" name="campo" value="{{ item.campo }}">
        <input type="hidden" name="valor" value="{% if item.ligado %}0{% else %}1{% endif %}">
        <input type="hidden" name="aula" value="{{ aula.pk|default:'' }}">
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit"
          class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-medium transition-all duration-200
          {% if item.ligado %}"
          style="background: var(--color-primary); color: #fff; border: 1px solid var(--color-primary);"
          {% else %}"
          style="background: var(--color-surface); color: var(--color-text-secondary); border: 1px solid var(--color-border);"
          {% endif %}
          aria-pressed="{% if item.ligado %}true{% else %}false{% endif %}">
          {% if item.campo == 'fonte_dislexia' %}🔤
          {% elif item.campo == 'leitura_voz' %}🔊
          {% elif item.campo == 'modo_limpo' %}☀️
          {% endif %}
          {{ item.rotulo }}
        </button>
      </form>
    {% endfor %}
  </div>
</div>
