<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}NextLearn{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    /* Estilo padrão dos formulários e botões usados em todas as páginas */
    main input[type=text], main input[type=password], main textarea, main select {
      @apply w-full rounded border border-slate-300 bg-white px-3 py-2;
    }
    .errorlist { @apply mt-1 text-sm text-red-700; }
    .helptext, .helptext ul { @apply block mt-1 text-xs text-slate-500; }
    .btn { @apply inline-block rounded bg-indigo-700 px-4 py-2 font-medium text-white hover:bg-indigo-800; }
    .btn-sec { @apply inline-block rounded border border-slate-300 bg-white px-4 py-2 font-medium text-slate-700 hover:bg-slate-100; }
    .cartao { @apply rounded-lg bg-white p-6 shadow; }
    .voltar { @apply text-sm text-indigo-700 hover:underline; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{% url 'contas:inicio' %}" class="text-xl font-bold text-indigo-700">NextLearn</a>
      {% if user.is_authenticated %}
        <div class="flex items-center gap-4 text-sm">
          <span>{{ user }} · {{ user.get_papel_display }}</span>
          {% if user.is_staff %}
            <a href="{% url 'admin:index' %}" class="text-indigo-700 hover:underline">Administração</a>
          {% endif %}
          <form method="post" action="{% url 'contas:sair' %}">
            {% csrf_token %}
            <button type="submit" class="text-slate-600 hover:text-slate-900 underline">Sair</button>
          </form>
        </div>
      {% endif %}
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    {% if messages %}
      {% for message in messages %}
        <p class="mb-4 rounded border px-4 py-2 {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-800{% else %}bg-indigo-50 border-indigo-200{% endif %}">{{ message }}</p>
      {% endfor %}
    {% endif %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
